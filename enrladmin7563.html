<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Image Upload</title>
<style>
  :root {
    --bg-deep: #0a0e17;
    --bg-panel: #10151f;
    --bg-input: #0d1220;
    --border: #1f2a3d;
    --border-soft: #232f45;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --accent-hover: #6a47ff;
    --text-main: #e6edf7;
    --text-dim: #7c8aa5;
    --green: #34d399;
    --red: #f87171;
    --mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(34,211,238,0.12), transparent 45%),
      var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px;
  }
  .topbar {
    max-width: 520px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); transform: translateX(-2px); }
  .back-btn svg { stroke: var(--text-main); }
  .container {
    max-width: 520px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--bg-panel), #0c1119);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  h1 {
    font-size: 21px;
    margin-bottom: 4px;
    color: #fff;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }
  p.sub {
    color: var(--text-dim);
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 13.5px;
  }
  
  /* AI Panel Styles */
  .ai-panel {
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .ai-toggle-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--accent-2);
    cursor: pointer;
    font-family: var(--mono);
    margin-bottom: 0;
  }
  .ai-toggle-label input {
    margin: 0;
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .ai-config {
    margin-top: 12px;
    display: none;
    border-top: 1px dashed var(--border-soft);
    padding-top: 12px;
  }
  .ai-config input {
    margin-bottom: 8px !important;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), #9b7bff);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.99); }
  button:disabled { background: #2a3346; cursor: not-allowed; filter: none; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }
  .status-ok { color: var(--green); }
  .status-err { color: var(--red); }
  .status-warn { color: var(--accent-2); }
  .progress-wrap {
    background: var(--bg-input);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
    border: 1px solid var(--border-soft);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.2s;
  }
  .list {
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .list h2 {
    font-size: 15px;
    color: #fff;
    margin-bottom: 12px;
    font-family: var(--mono);
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-input);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border-soft);
  }
  .entry img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .entry .info {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .entry .digits {
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 1px;
    font-family: var(--mono);
  }
  .entry button.del {
    width: auto;
    padding: 6px 10px;
    background: #3a1a1a;
    color: var(--red);
    border: 1px solid #5a2323;
    font-size: 12px;
  }
  .entry button.del:hover { background: #4a2020; filter: none; }
  .empty { color: var(--text-dim); font-size: 13px; }
  .preview-wrap {
    display: none;
    margin-bottom: 16px;
    text-align: center;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 10px;
  }
  .preview-wrap p {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .preview-wrap img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html" title="Back to home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
  </a>
</div>
<div class="container">
  <h1>🔐 Admin Panel</h1>
  <p class="sub">Upload an image and tag it with the last 4 digits of the user's phone number.</p>

  <!-- AI Configuration Panel -->
  <div class="ai-panel">
    <label class="ai-toggle-label">
      <input type="checkbox" id="aiToggle"> 🤖 Enable AI Auto-Extract (Last 4 Digits)
    </label>
    <div class="ai-config" id="aiConfig">
      <label for="aiApiKey">OpenRouter API Key</label>
      <input type="text" id="aiApiKey" placeholder="Enter API Key">
      <label for="aiModel">Server / Model Name</label>
      <input type="text" id="aiModel" placeholder="e.g. openrouter/free">
    </div>
  </div>

  <form id="uploadForm">
    <label for="digits">Last 4 Digits of Phone/Aadhaar Number</label>
    <input type="text" id="digits" maxlength="4" pattern="[0-9]{4}" placeholder="e.g. 1234" required>

    <label for="fileInput">Choose Image <span style="color:var(--text-dim); font-weight:400;">(max 1.5 MB)</span></label>
    <input type="file" id="fileInput" accept="image/*" required>

    <div class="preview-wrap" id="previewWrap">
      <p>👁️ Preview - Confirm this is the correct photo</p>
      <img id="previewImg" src="" alt="Preview">
    </div>

    <button type="submit" id="submitBtn">Upload</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="status"></div>
  </form>

  <div class="list">
    <h2>📋 Uploaded Entries <span id="entryCount" style="color:var(--accent-2); font-weight:400;"></span></h2>
    <div id="entriesList"><p class="empty">Loading...</p></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, set, remove, onValue
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBe-U7wifvDNot0dDQv4DUviWnz0c-FTmM",
    authDomain: "enrl-87967.firebaseapp.com",
    databaseURL: "https://enrl-87967-default-rtdb.firebaseio.com",
    projectId: "enrl-87967",
    storageBucket: "enrl-87967.firebasestorage.app",
    messagingSenderId: "656700035261",
    appId: "1:656700035261:web:2186c045a81bbc4b4827d4",
    measurementId: "G-29M7EQY5LJ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MAX_FILE_BYTES = 1.5 * 1024 * 1024; // 1.5 MB

  function fileToBase64(file, onProgress) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress((e.loaded / e.total) * 100);
        }
      };
      reader.onload = () => resolve(reader.result); 
      reader.onerror = () => reject(reader.error || new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  // DOM Elements
  const form = document.getElementById('uploadForm');
  const digitsInput = document.getElementById('digits');
  const fileInput = document.getElementById('fileInput');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const entriesList = document.getElementById('entriesList');
  const entryCount = document.getElementById('entryCount');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');
  
  // AI Elements
  const aiToggle = document.getElementById('aiToggle');
  const aiConfig = document.getElementById('aiConfig');
  const aiApiKey = document.getElementById('aiApiKey');
  const aiModel = document.getElementById('aiModel');

  // Load and Set AI LocalStorage settings
  aiApiKey.value = localStorage.getItem('aiApiKey') || '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';
  aiModel.value = localStorage.getItem('aiModel') || 'openrouter/free';
  aiToggle.checked = localStorage.getItem('aiToggle') === 'true';

  if (aiToggle.checked) {
    aiConfig.style.display = 'block';
  }

  // Real-time Save AI Inputs
  aiApiKey.addEventListener('input', () => localStorage.setItem('aiApiKey', aiApiKey.value));
  aiModel.addEventListener('input', () => localStorage.setItem('aiModel', aiModel.value));
  aiToggle.addEventListener('change', () => {
    localStorage.setItem('aiToggle', aiToggle.checked);
    aiConfig.style.display = aiToggle.checked ? 'block' : 'none';
  });

  let latestEntries = {};

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type === 'ok' ? 'status-ok' : (type === 'err' ? 'status-err' : (type === 'warn' ? 'status-warn' : ''));
  }

  // Modified file change event to include AI OCR
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (file) {
      const objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;
      previewWrap.style.display = 'block';

      // Execute AI only if Toggle is ON
      if (aiToggle.checked) {
        const apiKey = aiApiKey.value.trim();
        const model = aiModel.value.trim();
        
        if (!apiKey || !model) {
          setStatus('⚠️ Please enter API Key and Server Name for AI.', 'err');
          return;
        }

        setStatus('🤖 AI is scanning the image...', 'warn');
        try {
          const base64Data = await fileToBase64(file);
          
          const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: model,
              messages: [
                {
                  role: 'user',
                  content: [
                    { type: 'text', text: 'Extract the last 4 digits of the Aadhaar number from this image. Output ONLY the 4 digits, nothing else. If you cannot find them, output NONE.' },
                    { type: 'image_url', image_url: { url: base64Data } }
                  ]
                }
              ]
            })
          });

          const json = await response.json();
          if (json.error) throw new Error(json.error.message || 'API Error');

          if (json.choices && json.choices.length > 0) {
            const reply = json.choices[0].message.content.trim();
            const match = reply.match(/\d{4}/);
            
            if (match) {
              digitsInput.value = match[0];
              setStatus('✅ AI successfully extracted digits: ' + match[0], 'ok');
            } else {
              setStatus('⚠️ AI could not detect the last 4 digits. Please type manually.', 'err');
            }
          }
        } catch (err) {
          console.error(err);
          setStatus('❌ AI Error: ' + err.message, 'err');
        }
      }
    } else {
      previewImg.src = '';
      previewWrap.style.display = 'none';
    }
  });

  // Original Form Submit logic (Untouched)
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const digits = digitsInput.value.trim();
    const file = fileInput.files[0];

    if (!/^[0-9]{4}$/.test(digits)) {
      setStatus('Please enter exactly 4 digits.', 'err');
      return;
    }
    if (!file) {
      setStatus('Please choose an image.', 'err');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      setStatus('Image is too large (max ' + (MAX_FILE_BYTES / (1024*1024)).toFixed(1) + ' MB). Please choose a smaller image.', 'err');
      return;
    }
    if (latestEntries && Object.prototype.hasOwnProperty.call(latestEntries, digits)) {
      setStatus('⚠️ The number "' + digits + '" is already used with a photo. Each entry\'s number must be unique, please use different digits.', 'err');
      alert('⚠️ Duplicate! "' + digits + '" is already used in an entry. It cannot be used again.');
      return;
    }

    submitBtn.disabled = true;
    setStatus('Uploading...', '');
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';

    const timestamp = Date.now();

    try {
      const base64Data = await fileToBase64(file, (pct) => {
        progressBar.style.width = pct + '%';
      });

      const entryRef = ref(db, 'entries/' + digits);
      await set(entryRef, {
        url: base64Data,
        fileName: file.name,
        timestamp: timestamp
      });

      progressBar.style.width = '100%';
      setStatus('✅ Upload successful! Tagged with digits "' + digits + '".', 'ok');
      form.reset();
      previewImg.src = '';
      previewWrap.style.display = 'none';
    } catch (err) {
      console.error(err);
      setStatus('Upload failed: ' + err.message, 'err');
    } finally {
      submitBtn.disabled = false;
      progressWrap.style.display = 'none';
    }
  });

  // Original Entries Fetch logic (Untouched)
  const entriesRef = ref(db, 'entries');
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    latestEntries = data || {};
    entriesList.innerHTML = '';
    if (!data) {
      entryCount.textContent = '(Total: 0)';
      entriesList.innerHTML = '<p class="empty">No entries yet.</p>';
      return;
    }
    const keys = Object.keys(data).sort((a, b) => (data[b].timestamp||0) - (data[a].timestamp||0));
    entryCount.textContent = '(Total: ' + keys.length + ')';
    keys.forEach((digits) => {
      const entry = data[digits];
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <img src="${entry.url}" alt="${digits}">
        <div class="info">
          <div class="digits">**** ${digits}</div>
          <div>${entry.fileName || ''}</div>
        </div>
        <button class="del" data-digits="${digits}">Delete</button>
      `;
      entriesList.appendChild(div);
    });

    entriesList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const digits = btn.getAttribute('data-digits');
        if (!confirm('Do you want to delete the entry for "' + digits + '"?')) return;
        try {
          await remove(ref(db, 'entries/' + digits));
        } catch (err) {
          alert('Delete error: ' + err.message);
        }
      });
    });
  });
</script>
</body>
</html>
