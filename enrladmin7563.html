<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Image Upload</title>
<style>
  :root {
    --bg-deep: #0a0e17;
    --bg-panel: #10151f;
    --bg-input: #0d1220;
    --border: #1f2a3d;
    --border-soft: #232f45;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --accent-hover: #6a47ff;
    --text-main: #e6edf7;
    --text-dim: #7c8aa5;
    --green: #34d399;
    --red: #f87171;
    --mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(34,211,238,0.12), transparent 45%),
      var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px;
  }
  .topbar {
    max-width: 520px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); transform: translateX(-2px); }
  .back-btn svg { stroke: var(--text-main); }
  .container {
    max-width: 520px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--bg-panel), #0c1119);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  h1 {
    font-size: 21px;
    margin-bottom: 4px;
    color: #fff;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }
  p.sub {
    color: var(--text-dim);
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 13.5px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), #9b7bff);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.99); }
  button:disabled { background: #2a3346; cursor: not-allowed; filter: none; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }
  .status-ok { color: var(--green); }
  .status-err { color: var(--red); }
  .progress-wrap {
    background: var(--bg-input);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
    border: 1px solid var(--border-soft);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.2s;
  }
  .list {
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .list h2 {
    font-size: 15px;
    color: #fff;
    margin-bottom: 12px;
    font-family: var(--mono);
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-input);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border-soft);
  }
  .entry img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .entry .info {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .entry .digits {
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 1px;
    font-family: var(--mono);
  }
  .entry button.del {
    width: auto;
    padding: 6px 10px;
    background: #3a1a1a;
    color: var(--red);
    border: 1px solid #5a2323;
    font-size: 12px;
  }
  .entry button.del:hover { background: #4a2020; filter: none; }
  .empty { color: var(--text-dim); font-size: 13px; }
  .preview-wrap {
    display: none;
    margin-bottom: 16px;
    text-align: center;
    background: var(--bg-input);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    padding: 10px;
  }
  .preview-wrap p {
    margin: 0 0 8px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .preview-wrap img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html" title="Back to home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
  </a>
</div>
<div class="container">
  <h1>🔐 Admin Panel</h1>
  <p class="sub">Image upload karein aur user ke phone number ke last 4 digit se tag karein.</p>

  <form id="uploadForm">
    <label for="digits">Phone Number ke Last 4 Digit</label>
    <input type="text" id="digits" maxlength="4" pattern="[0-9]{4}" placeholder="jaise: 1234" required>

    <label for="fileInput">Image Chuniye <span style="color:var(--text-dim); font-weight:400;">(max 1.5 MB)</span></label>
    <input type="file" id="fileInput" accept="image/*" required>

    <div class="preview-wrap" id="previewWrap">
      <p>👁️ Preview - Confirm karein ki sahi photo hai</p>
      <img id="previewImg" src="" alt="Preview">
    </div>

    <button type="submit" id="submitBtn">Upload Karein</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="status"></div>
  </form>

  <div class="list">
    <h2>📋 Uploaded Entries</h2>
    <div id="entriesList"><p class="empty">Loading...</p></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, set, remove, onValue
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBe-U7wifvDNot0dDQv4DUviWnz0c-FTmM",
    authDomain: "enrl-87967.firebaseapp.com",
    databaseURL: "https://enrl-87967-default-rtdb.firebaseio.com",
    projectId: "enrl-87967",
    storageBucket: "enrl-87967.firebasestorage.app",
    messagingSenderId: "656700035261",
    appId: "1:656700035261:web:2186c045a81bbc4b4827d4",
    measurementId: "G-29M7EQY5LJ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MAX_FILE_BYTES = 1.5 * 1024 * 1024; // 1.5 MB

  function fileToBase64(file, onProgress) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onprogress = (e) => {
        if (e.lengthComputable && onProgress) {
          onProgress((e.loaded / e.total) * 100);
        }
      };
      reader.onload = () => resolve(reader.result); 
      reader.onerror = () => reject(reader.error || new Error('File read failed'));
      reader.readAsDataURL(file);
    });
  }

  const form = document.getElementById('uploadForm');
  const digitsInput = document.getElementById('digits');
  const fileInput = document.getElementById('fileInput');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const entriesList = document.getElementById('entriesList');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg = document.getElementById('previewImg');

  // Latest snapshot of existing entries, kept in sync by onValue below.
  // Used to check ki koi digit/number dobara (duplicate) to nahi use ho raha.
  let latestEntries = {};

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) {
      const objectUrl = URL.createObjectURL(file);
      previewImg.src = objectUrl;
      previewWrap.style.display = 'block';
    } else {
      previewImg.src = '';
      previewWrap.style.display = 'none';
    }
  });

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type === 'ok' ? 'status-ok' : (type === 'err' ? 'status-err' : '');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const digits = digitsInput.value.trim();
    const file = fileInput.files[0];

    if (!/^[0-9]{4}$/.test(digits)) {
      setStatus('Kripya exactly 4 digit number daalein.', 'err');
      return;
    }
    if (!file) {
      setStatus('Kripya ek image chunein.', 'err');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      setStatus('Image bahut badi hai (max ' + (MAX_FILE_BYTES / (1024*1024)).toFixed(1) + ' MB). Chhoti image chunein.', 'err');
      return;
    }
    if (latestEntries && Object.prototype.hasOwnProperty.call(latestEntries, digits)) {
      setStatus('⚠️ Yeh number "' + digits + '" pehle se ek photo ke saath available hai. Har photo ka number/password unique hona chahiye, kripya alag digits use karein.', 'err');
      alert('⚠️ Duplicate! "' + digits + '" pehle se ek entry me use ho chuka hai. Isse dobara use nahi kar sakte.');
      return;
    }

    submitBtn.disabled = true;
    setStatus('Upload ho raha hai...', '');
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';

    const timestamp = Date.now();

    try {
      const base64Data = await fileToBase64(file, (pct) => {
        progressBar.style.width = pct + '%';
      });

      const entryRef = ref(db, 'entries/' + digits);
      await set(entryRef, {
        url: base64Data,
        fileName: file.name,
        timestamp: timestamp
      });

      progressBar.style.width = '100%';
      setStatus('✅ Upload safal! Digits "' + digits + '" se tag ho gaya.', 'ok');
      form.reset();
      previewImg.src = '';
      previewWrap.style.display = 'none';
    } catch (err) {
      console.error(err);
      setStatus('Upload fail hua: ' + err.message, 'err');
    } finally {
      submitBtn.disabled = false;
      progressWrap.style.display = 'none';
    }
  });

  const entriesRef = ref(db, 'entries');
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    latestEntries = data || {};
    entriesList.innerHTML = '';
    if (!data) {
      entriesList.innerHTML = '<p class="empty">Abhi koi entry nahi hai.</p>';
      return;
    }
    const keys = Object.keys(data).sort((a, b) => (data[b].timestamp||0) - (data[a].timestamp||0));
    keys.forEach((digits) => {
      const entry = data[digits];
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <img src="${entry.url}" alt="${digits}">
        <div class="info">
          <div class="digits">**** ${digits}</div>
          <div>${entry.fileName || ''}</div>
        </div>
        <button class="del" data-digits="${digits}">Delete</button>
      `;
      entriesList.appendChild(div);
    });

    entriesList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const digits = btn.getAttribute('data-digits');
        if (!confirm('Kya aap "' + digits + '" ki entry delete karna chahte hain?')) return;
        try {
          await remove(ref(db, 'entries/' + digits));
        } catch (err) {
          alert('Delete error: ' + err.message);
        }
      });
    });
  });
</script>
</body>
</html>
