<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Image Upload</title>
<style>
  :root {
    --bg-deep: #0a0e17;
    --bg-panel: #10151f;
    --bg-input: #0d1220;
    --border: #1f2a3d;
    --border-soft: #232f45;
    --accent: #7c5cff;
    --accent-2: #22d3ee;
    --accent-hover: #6a47ff;
    --text-main: #e6edf7;
    --text-dim: #7c8aa5;
    --green: #34d399;
    --red: #f87171;
    --mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(34,211,238,0.12), transparent 45%),
      var(--bg-deep);
    color: var(--text-main);
    min-height: 100vh;
    margin: 0;
    padding: 30px 15px;
  }
  .topbar {
    max-width: 520px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    cursor: pointer;
    text-decoration: none;
    transition: border-color 0.2s, transform 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); transform: translateX(-2px); }
  .back-btn svg { stroke: var(--text-main); }
  .container {
    max-width: 520px;
    margin: 0 auto;
    background: linear-gradient(180deg, var(--bg-panel), #0c1119);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .container::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  h1 {
    font-size: 21px;
    margin-bottom: 4px;
    color: #fff;
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }
  p.sub {
    color: var(--text-dim);
    margin-top: 0;
    margin-bottom: 24px;
    font-size: 13.5px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-input);
    color: var(--text-main);
    font-size: 15px;
    margin-bottom: 16px;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), #9b7bff);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s, transform 0.1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.99); }
  button:disabled { background: #2a3346; cursor: not-allowed; filter: none; }
  #status {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 18px;
  }
  .status-ok { color: var(--green); }
  .status-err { color: var(--red); }
  .progress-wrap {
    background: var(--bg-input);
    border-radius: 8px;
    height: 8px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
    border: 1px solid var(--border-soft);
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.2s;
  }
  .list {
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .list h2 {
    font-size: 15px;
    color: #fff;
    margin-bottom: 12px;
    font-family: var(--mono);
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-input);
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border-soft);
  }
  .entry img {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .entry .info {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    word-break: break-all;
  }
  .entry .digits {
    font-weight: 700;
    color: var(--accent-2);
    letter-spacing: 1px;
    font-family: var(--mono);
  }
  .entry button.del {
    width: auto;
    padding: 6px 10px;
    background: #3a1a1a;
    color: var(--red);
    border: 1px solid #5a2323;
    font-size: 12px;
  }
  .entry button.del:hover { background: #4a2020; filter: none; }
  .empty { color: var(--text-dim); font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back-btn" href="index.html" title="Back to home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"></path>
      <path d="M12 19l-7-7 7-7"></path>
    </svg>
  </a>
</div>
<div class="container">
  <h1>🔐 Admin Panel</h1>
  <p class="sub">Image upload karein aur user ke phone number ke last 4 digit se tag karein.</p>

  <form id="uploadForm">
    <label for="digits">Phone Number ke Last 4 Digit</label>
    <input type="text" id="digits" maxlength="4" pattern="[0-9]{4}" placeholder="jaise: 1234" required>

    <label for="fileInput">Image Chuniye</label>
    <input type="file" id="fileInput" accept="image/*" required>

    <button type="submit" id="submitBtn">Upload Karein</button>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="status"></div>
  </form>

  <div class="list">
    <h2>📋 Uploaded Entries</h2>
    <div id="entriesList"><p class="empty">Loading...</p></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase, ref, set, remove, onValue
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {
    getStorage, ref as sRef, uploadBytesResumable, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCtedhm7TlywjRg3CNxk6Cq-lDm1Sm0Vak",
    authDomain: "thejaya-ree.firebaseapp.com",
    databaseURL: "https://thejaya-ree-default-rtdb.firebaseio.com",
    projectId: "thejaya-ree",
    storageBucket: "thejaya-ree.firebasestorage.app",
    messagingSenderId: "455693511785",
    appId: "1:455693511785:web:219f743c36966f667d86f8",
    measurementId: "G-YXH3V9N0N5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const storage = getStorage(app);

  const form = document.getElementById('uploadForm');
  const digitsInput = document.getElementById('digits');
  const fileInput = document.getElementById('fileInput');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const entriesList = document.getElementById('entriesList');

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type === 'ok' ? 'status-ok' : (type === 'err' ? 'status-err' : '');
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const digits = digitsInput.value.trim();
    const file = fileInput.files[0];

    if (!/^[0-9]{4}$/.test(digits)) {
      setStatus('Kripya exactly 4 digit number daalein.', 'err');
      return;
    }
    if (!file) {
      setStatus('Kripya ek image chunein.', 'err');
      return;
    }

    submitBtn.disabled = true;
    setStatus('Upload ho raha hai...', '');
    progressWrap.style.display = 'block';
    progressBar.style.width = '0%';

    const timestamp = Date.now();
    const filePath = `images/${digits}_${timestamp}_${file.name}`;
    const storageReference = sRef(storage, filePath);
    const uploadTask = uploadBytesResumable(storageReference, file);

    uploadTask.on('state_changed',
      (snapshot) => {
        const pct = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
        progressBar.style.width = pct + '%';
      },
      (error) => {
        console.error(error);
        setStatus('Upload fail hua: ' + error.message, 'err');
        submitBtn.disabled = false;
        progressWrap.style.display = 'none';
      },
      async () => {
        try {
          const url = await getDownloadURL(uploadTask.snapshot.ref);
          const entryRef = ref(db, 'entries/' + digits);
          await set(entryRef, {
            url: url,
            path: filePath,
            fileName: file.name,
            timestamp: timestamp
          });
          setStatus('✅ Upload safal! Digits "' + digits + '" se tag ho gaya.', 'ok');
          form.reset();
        } catch (err) {
          console.error(err);
          setStatus('Database save mein error: ' + err.message, 'err');
        } finally {
          submitBtn.disabled = false;
          progressWrap.style.display = 'none';
        }
      }
    );
  });

  // Live list of entries
  const entriesRef = ref(db, 'entries');
  onValue(entriesRef, (snapshot) => {
    const data = snapshot.val();
    entriesList.innerHTML = '';
    if (!data) {
      entriesList.innerHTML = '<p class="empty">Abhi koi entry nahi hai.</p>';
      return;
    }
    const keys = Object.keys(data).sort((a, b) => (data[b].timestamp||0) - (data[a].timestamp||0));
    keys.forEach((digits) => {
      const entry = data[digits];
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <img src="${entry.url}" alt="${digits}">
        <div class="info">
          <div class="digits">**** ${digits}</div>
          <div>${entry.fileName || ''}</div>
        </div>
        <button class="del" data-digits="${digits}" data-path="${entry.path || ''}">Delete</button>
      `;
      entriesList.appendChild(div);
    });

    entriesList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const digits = btn.getAttribute('data-digits');
        const path = btn.getAttribute('data-path');
        if (!confirm('Kya aap "' + digits + '" ki entry delete karna chahte hain?')) return;
        try {
          await remove(ref(db, 'entries/' + digits));
          if (path) {
            try { await deleteObject(sRef(storage, path)); } catch (e) { console.warn('Storage delete warn:', e); }
          }
        } catch (err) {
          alert('Delete error: ' + err.message);
        }
      });
    });
  });
</script>
</body>
</html>
