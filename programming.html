<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMITcs Programming</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f8fa;
    --panel-2:#eef0f3;
    --border:#dde1e7;
    --text:#161a20;
    --muted:#6b7482;
    --amber:#e0921f;
    --amber-dim:#f2a93b33;
    --green:#1f9d5c;
    --red:#d13a47;
    --mono: ui-monospace, "Cascadia Code", "Fira Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 90% -10%, #fdf2df 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #eaf5ef 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  #app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.75);backdrop-filter:blur(6px);
    position:sticky;top:0;z-index:10;
  }
  .brand{font-family:var(--mono);font-weight:600;font-size:18px;letter-spacing:0.5px;}
  .brand .cursor{color:var(--amber);animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  nav{display:flex;gap:8px;}
  .nav-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    width:38px;height:38px;padding:0;border-radius:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .15s ease;
  }
  .nav-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;}
  .nav-btn:hover{color:var(--text);border-color:#b9c0cc;}
  .nav-btn.active{color:#ffffff;background:var(--amber);border-color:var(--amber);font-weight:600;}

  .bottom-nav{
    position:fixed;right:24px;bottom:24px;z-index:50;
    display:flex;gap:10px;padding:8px;border-radius:16px;
    background:rgba(255,255,255,0.85);backdrop-filter:blur(6px);
    border:1px solid var(--border);box-shadow:0 10px 30px -10px rgba(0,0,0,.2);
  }

  main{flex:1;padding:32px 24px 60px;max-width:1180px;margin:0 auto;width:100%;}
  .view{display:none;}
  .view.active{display:block;animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- Home ---------- */
  .hero{margin-bottom:34px;}
  .eyebrow{
    font-family:var(--mono);color:var(--amber);font-size:13px;margin:0 0 10px;
    letter-spacing:0.3px;
  }
  .hero h1{
    font-family:var(--mono);font-size:clamp(24px,3.4vw,38px);line-height:1.25;
    margin:0;max-width:820px;font-weight:600;
  }
  .lang-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;
  }
  .lang-card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:20px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    text-align:left;
  }
  .lang-card::before{
    content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s ease;
    background:radial-gradient(120px 80px at 20% 0%, var(--card-color,#666) 0%, transparent 70%);
  }
  .lang-card:hover{transform:translateY(-3px);border-color:var(--card-color,#3a4657);
    box-shadow:0 10px 24px -12px rgba(0,0,0,.5);}
  .lang-card:hover::before{opacity:.18;}
  .lang-icon{
    width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:15px;color:#0b0f14;
    background:var(--card-color,#888);margin-bottom:14px;position:relative;z-index:1;
  }
  .lang-name{font-weight:600;font-size:16px;margin:0 0 2px;position:relative;z-index:1;}
  .lang-sub{color:var(--muted);font-size:12px;font-family:var(--mono);position:relative;z-index:1;}

  /* ---------- Projects ---------- */
  .section-head{margin-bottom:22px;}
  .section-head h2{font-family:var(--mono);margin:0 0 4px;font-size:22px;}
  .section-head p{color:var(--muted);margin:0;font-size:13px;}
  .project-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .project-card{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .project-top{display:flex;align-items:center;gap:10px;}
  .project-badge{
    font-family:var(--mono);font-size:11px;font-weight:700;color:#0b0f14;
    padding:3px 8px;border-radius:6px;background:var(--card-color,#888);
  }
  .project-name{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .project-meta{color:var(--muted);font-size:11px;font-family:var(--mono);}
  .project-actions{display:flex;gap:8px;margin-top:4px;}
  .empty-state{display:none;color:var(--muted);font-family:var(--mono);font-size:13px;
    border:1px dashed var(--border);border-radius:12px;padding:34px;text-align:center;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--mono);font-size:12.5px;padding:8px 13px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;
    transition:all .15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:#3a4657;}
  .btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1305;font-weight:700;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.ghost{background:transparent;}
  .btn.danger{color:var(--red);}
  .btn.danger:hover{border-color:var(--red);}
  .btn.small{padding:6px 10px;font-size:11px;}

  /* ---------- Editor ---------- */
  .editor-head{
    display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:18px;
  }
  .editor-title{display:flex;align-items:center;gap:10px;}
  .editor-title .lang-icon{width:34px;height:34px;font-size:12px;margin:0;}
  .editor-title h2{font-family:var(--mono);margin:0;font-size:19px;}
  .save-row{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .save-row input{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:8px;font-family:var(--mono);font-size:12.5px;width:170px;
  }
  .status-pill{
    font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;
  }
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab-btn{
    font-family:var(--mono);font-size:12px;padding:7px 14px;border-radius:8px 8px 0 0;
    border:1px solid var(--border);border-bottom:none;background:var(--panel);color:var(--muted);cursor:pointer;
  }
  .tab-btn.active{color:var(--text);background:var(--panel-2);border-color:#3a4657;}

  .code-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel-2);}
  textarea.code-area{
    width:100%;min-height:340px;resize:vertical;background:#ffffff;color:#1c2129;
    border:none;outline:none;font-family:var(--mono);font-size:13.5px;line-height:1.55;
    padding:16px 18px;tab-size:2;
  }
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
  .run-panel{
    margin-top:6px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#ffffff;
  }
  .run-panel-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
  }
  .run-panel-head .dots{display:flex;gap:5px;}
  .run-panel-head .dots span{width:9px;height:9px;border-radius:50%;display:inline-block;}
  iframe.preview{width:100%;height:340px;border:none;background:#fff;}
  .console-out{
    padding:14px 16px;font-family:var(--mono);font-size:13px;white-space:pre-wrap;
    min-height:100px;max-height:340px;overflow:auto;color:#1c2129;
  }
  .console-out .err{color:var(--red);}
  .note-box{
    font-family:var(--mono);font-size:12px;color:var(--muted);padding:14px 16px;
    border-top:1px dashed var(--border);
  }

  @media (max-width:640px){
    .save-row{margin-left:0;width:100%;}
    .save-row input{width:100%;}
  }
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">MMITcs<span class="cursor">_</span>Programming</div>
    <a class="nav-btn" href="index.html" title="Back" aria-label="Back">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 9 12l6 6"/></svg>
    </a>
  </header>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
    </button>
    <button class="nav-btn" data-view="projects" title="My Projects" aria-label="My Projects">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>
    </button>
  </nav>

  <main>

    <!-- HOME -->
    <section id="view-home" class="view active">
      <div class="hero">
        <p class="eyebrow">// pick a language and start coding</p>
        
      </div>
      <div class="lang-grid" id="langGrid"></div>
    </section>

    <!-- PROJECTS -->
    <section id="view-projects" class="view">
      <div class="section-head">
        <h2>My Projects</h2>
        <p>Only the project name is saved here — in this device's local storage.</p>
      </div>
      <div class="project-list" id="projectList"></div>
      <div class="empty-state" id="projectsEmpty">No projects saved yet.<br>Write code in any language and click "Save Project".</div>
    </section>

    <!-- EDITOR -->
    <section id="view-editor" class="view">
      <div class="editor-head">
        <button class="btn ghost small" id="backBtn">&larr; Back</button>
        <div class="editor-title">
          <div class="lang-icon" id="editorIcon"></div>
          <h2 id="editorTitle"></h2>
        </div>
        <div class="save-row">
          <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Saved as draft</span></span>
          <input type="text" id="projectNameInput" placeholder="project name...">
          <button class="btn primary small" id="saveProjectBtn">Save Project</button>
        </div>
      </div>

      <div class="tabs" id="webTabs" style="display:none;">
        <button class="tab-btn active" data-tab="html">HTML</button>
        <button class="tab-btn" data-tab="css">CSS</button>
        <button class="tab-btn" data-tab="js">JS</button>
      </div>

      <div class="code-wrap">
        <textarea class="code-area" id="codeArea" spellcheck="false"></textarea>
      </div>

      <div class="toolbar">
        <button class="btn primary" id="runBtn">▶ Run</button>
        <button class="btn" id="downloadBtn">⬇ Download</button>
        <button class="btn ghost" id="resetBtn">Clear code</button>
      </div>
    </section>

    <!-- RUN (separate page per language, opened from the editor's Run button) -->
    <section id="view-run" class="view">
      <div class="editor-head">
        <button class="btn ghost small" id="runBackBtn">&larr; Back to editor</button>
        <div class="editor-title">
          <div class="lang-icon" id="runIcon"></div>
          <h2 id="runTitle"></h2>
        </div>
      </div>

      <div class="run-panel" id="runPanel">
        <div class="run-panel-head">
          <span id="runPanelLabel">Output</span>
          <span class="dots"><span style="background:#ef5f6c"></span><span style="background:#f2a93b"></span><span style="background:#4fd18b"></span></span>
        </div>
        <div id="runPanelBody"></div>
      </div>
    </section>

  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Language metadata ---------------- */
  const LANGS = [
    { id:"web",        name:"Web",        sub:"HTML + CSS + JS", color:"#e8703a", icon:"&lt;/&gt;", ext:"html", kind:"web" },
    { id:"c",           name:"C",          sub:"C language",       color:"#5c6bc0", icon:"C",      ext:"c",    kind:"c" },
    { id:"cpp",         name:"C++",        sub:"C++ language",     color:"#3f78c1", icon:"C++",    ext:"cpp",  kind:"cpp" },
    { id:"java",        name:"Java",       sub:"Java language",    color:"#e0793c", icon:"Jv",     ext:"java", kind:"static" },
    { id:"python",      name:"Python",     sub:"Python language",  color:"#3e7fad", icon:"Py",     ext:"py",   kind:"python" },
    { id:"javascript",  name:"JavaScript", sub:"Standalone JS",    color:"#d8b93a", icon:"JS",     ext:"js",   kind:"js" },
    { id:"csharp",      name:"C#",         sub:"C# language",      color:"#8f4fa8", icon:"C#",     ext:"cs",   kind:"static" },
    { id:"php",         name:"PHP",        sub:"PHP language",     color:"#6c72ac", icon:"php",    ext:"php",  kind:"static" },
    { id:"kotlin",      name:"Kotlin",     sub:"Kotlin language",  color:"#7f52ff", icon:"Kt",     ext:"kt",   kind:"static" },
    { id:"go",          name:"Go",         sub:"Go language",      color:"#3aa7c4", icon:"Go",     ext:"go",   kind:"static" }
  ];

  const STARTERS = {
    web: {
      html: "<h1>Hello MMITcs!</h1>\n<p>Write your HTML here.</p>",
      css: "body{\n  font-family: sans-serif;\n  background:#111;\n  color:#eee;\n  padding:20px;\n}",
      js: "console.log('Hello from JS');"
    },
    c: `#include <stdio.h>\n\nint main() {\n    printf("Hello, MMITcs!\\n");\n    return 0;\n}\n`,
    cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, MMITcs!" << endl;\n    return 0;\n}\n`,
    java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello, MMITcs!");\n    }\n}\n`,
    python: `print("Hello, MMITcs!")\n`,
    javascript: `console.log("Hello, MMITcs!");\n`,
    csharp: `using System;\n\nclass Program {\n    static void Main() {\n        Console.WriteLine("Hello, MMITcs!");\n    }\n}\n`,
    php: `<?php\n  echo "Hello, MMITcs!";\n?>\n`,
    kotlin: `fun main() {\n    println("Hello, MMITcs!")\n}\n`,
    go: `package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, MMITcs!")\n}\n`
  };

  const LS_PROJECTS = "mmitcs_projects";
  const draftKey = id => "mmitcs_draft_" + id;

  const byId = id => document.getElementById(id);
  const langById = id => LANGS.find(l => l.id === id);

  /* ---------------- Storage helpers ---------------- */
  function getProjects(){
    try { return JSON.parse(localStorage.getItem(LS_PROJECTS)) || []; }
    catch(e){ return []; }
  }
  function setProjects(list){
    localStorage.setItem(LS_PROJECTS, JSON.stringify(list));
  }
  function getDraft(langId){
    try {
      const raw = localStorage.getItem(draftKey(langId));
      if (raw) return JSON.parse(raw);
    } catch(e){}
    const lang = langById(langId);
    return lang.kind === "web"
      ? { html: STARTERS.web.html, css: STARTERS.web.css, js: STARTERS.web.js }
      : { code: STARTERS[langId] || "" };
  }
  function setDraft(langId, data){
    localStorage.setItem(draftKey(langId), JSON.stringify(data));
  }

  /* ---------------- App state ---------------- */
  let state = {
    view: "home",
    currentLang: null,
    currentProjectId: null,   // null => unsaved draft
    webTab: "html",
    data: null                // { html, css, js } or { code }
  };

  /* ---------------- Navigation ---------------- */
  function showView(name){
    state.view = name;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    byId("view-" + name).classList.add("active");
    document.querySelectorAll(".bottom-nav .nav-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.view === name);
    });
  }

  document.querySelectorAll(".bottom-nav .nav-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.view === "projects") renderProjects();
      showView(btn.dataset.view);
    });
  });
  byId("backBtn").addEventListener("click", () => {
    showView(state.currentProjectId ? "projects" : "home");
  });

  /* ---------------- Home: language grid ---------------- */
  function renderLangGrid(){
    const grid = byId("langGrid");
    grid.innerHTML = "";
    LANGS.forEach(lang => {
      const card = document.createElement("button");
      card.className = "lang-card";
      card.style.setProperty("--card-color", lang.color);
      card.innerHTML = `
        <div class="lang-icon" style="background:${lang.color}">${lang.icon}</div>
        <p class="lang-name">${lang.name}</p>
        <p class="lang-sub">${lang.sub}</p>`;
      card.addEventListener("click", () => openEditor(lang.id, null));
      grid.appendChild(card);
    });
  }

  /* ---------------- Projects list ---------------- */
  function renderProjects(){
    const list = byId("projectList");
    const empty = byId("projectsEmpty");
    const projects = getProjects().sort((a,b) => b.updatedAt - a.updatedAt);
    list.innerHTML = "";
    empty.style.display = projects.length ? "none" : "block";
    projects.forEach(p => {
      const lang = langById(p.langId) || LANGS[0];
      const card = document.createElement("div");
      card.className = "project-card";
      card.style.setProperty("--card-color", lang.color);
      const date = new Date(p.updatedAt);
      card.innerHTML = `
        <div class="project-top">
          <span class="project-badge" style="background:${lang.color}">${lang.name}</span>
          <span class="project-name">${escapeHtml(p.name)}</span>
        </div>
        <span class="project-meta">Last saved: ${date.toLocaleDateString()} ${date.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
        <div class="project-actions">
          <button class="btn small open-btn">Open</button>
          <button class="btn small danger delete-btn">Delete</button>
        </div>`;
      card.querySelector(".open-btn").addEventListener("click", () => openEditor(p.langId, p.id));
      card.querySelector(".delete-btn").addEventListener("click", () => {
        if (confirm(`Delete project "${p.name}"?`)) {
          setProjects(getProjects().filter(x => x.id !== p.id));
          renderProjects();
        }
      });
      list.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ---------------- Editor ---------------- */
  function openEditor(langId, projectId){
    const lang = langById(langId);
    state.currentLang = langId;
    state.currentProjectId = projectId;
    state.webTab = "html";

    if (projectId){
      const proj = getProjects().find(p => p.id === projectId);
      state.data = proj ? JSON.parse(JSON.stringify(proj.data)) : getDraft(langId);
      byId("projectNameInput").value = proj ? proj.name : "";
    } else {
      state.data = getDraft(langId);
      byId("projectNameInput").value = "";
    }

    byId("editorIcon").style.background = lang.color;
    byId("editorIcon").innerHTML = lang.icon;
    byId("editorTitle").textContent = lang.name + " Editor";
    byId("webTabs").style.display = lang.kind === "web" ? "flex" : "none";
    byId("runPanel").style.display = "none";
    byId("runPanelBody").innerHTML = "";

    loadCodeIntoTextarea();
    updateStatus();
    showView("editor");
  }

  function currentCode(){
    const lang = langById(state.currentLang);
    if (lang.kind === "web") return state.data[state.webTab];
    return state.data.code;
  }
  function setCurrentCode(val){
    const lang = langById(state.currentLang);
    if (lang.kind === "web") state.data[state.webTab] = val;
    else state.data.code = val;
  }
  function loadCodeIntoTextarea(){
    byId("codeArea").value = currentCode();
  }

  // Tabs (web only)
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state.webTab = btn.dataset.tab;
      loadCodeIntoTextarea();
    });
  });

  // Tab key -> insert 2 spaces
  byId("codeArea").addEventListener("keydown", e => {
    if (e.key === "Tab"){
      e.preventDefault();
      const ta = e.target;
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0,start) + "  " + ta.value.slice(end);
      ta.selectionStart = ta.selectionEnd = start + 2;
      ta.dispatchEvent(new Event("input"));
    }
  });

  // Auto-save on type (debounced)
  let saveTimer = null;
  byId("codeArea").addEventListener("input", e => {
    setCurrentCode(e.target.value);
    byId("statusText").textContent = "Saving...";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistCurrent, 400);
  });

  function persistCurrent(){
    setDraft(state.currentLang, state.data);
    if (state.currentProjectId){
      const projects = getProjects();
      const idx = projects.findIndex(p => p.id === state.currentProjectId);
      if (idx > -1){
        projects[idx].data = state.data;
        projects[idx].updatedAt = Date.now();
        setProjects(projects);
      }
    }
    updateStatus();
  }
  function updateStatus(){
    byId("statusText").textContent = state.currentProjectId
      ? "Saved to project"
      : "Saved as draft (local)";
  }

  // Reset draft
  byId("resetBtn").addEventListener("click", () => {
    if (!confirm("Delete all code for this language? This cannot be undone.")) return;
    const lang = langById(state.currentLang);
    state.data = lang.kind === "web"
      ? { html: "", css: "", js: "" }
      : { code: "" };
    loadCodeIntoTextarea();
    persistCurrent();
  });

  /* ---------------- Save as project ---------------- */
  byId("saveProjectBtn").addEventListener("click", () => {
    const name = byId("projectNameInput").value.trim();
    if (!name){ alert("Please enter a project name first."); return; }
    const projects = getProjects();

    if (state.currentProjectId){
      const idx = projects.findIndex(p => p.id === state.currentProjectId);
      if (idx > -1){
        projects[idx].name = name;
        projects[idx].data = state.data;
        projects[idx].updatedAt = Date.now();
      }
    } else {
      const id = "p_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
      projects.push({
        id, name, langId: state.currentLang,
        data: state.data, updatedAt: Date.now()
      });
      state.currentProjectId = id;
    }
    setProjects(projects);
    updateStatus();
    alert(`Project "${name}" saved!`);
  });

  /* ---------------- Real in-browser runtimes (Python + C/C++) ---------------- */
  // These load lazily (only on first Run) from a CDN, so the rest of the app
  // still works fully offline. Nothing below changes any existing behaviour
  // for Web, JavaScript, or the other languages.
  let pyodideInstance = null, pyodidePromise = null;
  function ensurePyodide(){
    if (pyodideInstance) return Promise.resolve(pyodideInstance);
    if (pyodidePromise) return pyodidePromise;
    pyodidePromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js";
      script.onload = () => {
        window.loadPyodide().then(inst => { pyodideInstance = inst; resolve(inst); }).catch(reject);
      };
      script.onerror = () => reject(new Error("Could not load the Python runtime (check your internet connection)."));
      document.head.appendChild(script);
    });
    return pyodidePromise;
  }

  let jscppLib = null, jscppPromise = null;
  function ensureJSCPP(){
    if (jscppLib) return Promise.resolve(jscppLib);
    if (window.JSCPP){ jscppLib = window.JSCPP; return Promise.resolve(jscppLib); }
    if (jscppPromise) return jscppPromise;
    jscppPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/JSCPP@2.0.9/dist/JSCPP.es5.min.js";
      script.onload = () => {
        if (window.JSCPP){ jscppLib = window.JSCPP; resolve(jscppLib); }
        else reject(new Error("C/C++ interpreter failed to initialize."));
      };
      script.onerror = () => reject(new Error("Could not load the C/C++ interpreter (check your internet connection)."));
      document.head.appendChild(script);
    });
    return jscppPromise;
  }

  async function runPython(code, body, label){
    label.textContent = "Console Output";
    body.innerHTML = '<div class="console-out">Loading Python runtime… (first run only, needs internet)</div>';
    try {
      const pyodide = await ensurePyodide();
      let stdout = "", stderr = "";
      pyodide.setStdout({ batched: s => { stdout += s + "\n"; } });
      pyodide.setStderr({ batched: s => { stderr += s + "\n"; } });
      let runErr = null;
      try { await pyodide.runPythonAsync(code); }
      catch(err){ runErr = err; }
      let html = "";
      if (stdout) html += escapeHtml(stdout);
      if (stderr) html += (html ? "\n" : "") + '<span class="err">' + escapeHtml(stderr) + '</span>';
      if (runErr) html += (html ? "\n" : "") + '<span class="err">Error: ' + escapeHtml(runErr.message || String(runErr)) + '</span>';
      const out = document.createElement("div");
      out.className = "console-out";
      out.innerHTML = html || "(no output. use print())";
      body.innerHTML = "";
      body.appendChild(out);
    } catch(loadErr){
      const note = document.createElement("div");
      note.className = "note-box";
      note.textContent = "Could not start the Python runtime (needs an internet connection the first time you run it). " + (loadErr.message || String(loadErr));
      body.innerHTML = "";
      body.appendChild(note);
    }
  }

  /*
   * C / C++ execution engine
   * ------------------------------------------------------------
   * Keep the existing editor, storage, projects, download and
   * navigation code untouched.  Only the C/C++ execution layer
   * is upgraded.
   *
   * JSCPP is used in-browser.  stdin is passed to JSCPP so common
   * programs using scanf/cin/getchar can actually receive input.
   */
  async function runCLike(code, body, label){
    label.textContent = "Console Output";
    body.innerHTML = '<div class="console-out">Loading C/C++ runtime… (first run only)</div>';

    try {
      const JSCPPlib = await ensureJSCPP();

      let stdout = "";
      let stderr = "";
      let exitCode = 0;

      /*
       * Ask for stdin only when the source appears to read input.
       * This keeps simple Hello World programs one-click.
       */
      const needsInput =
        /\b(scanf|fscanf|sscanf|getchar|getc|fgetc|gets|cin|getline|std::cin|std::getline)\b/.test(code);

      let stdin = "";
      if (needsInput) {
        const supplied = window.prompt(
          "C/C++ Standard Input (optional)\n" +
          "Enter input values exactly as your program expects.\n" +
          "Example: 10 20",
          ""
        );
        if (supplied === null) {
          body.innerHTML = "";
          const cancelled = document.createElement("div");
          cancelled.className = "console-out";
          cancelled.textContent = "Run cancelled.";
          body.appendChild(cancelled);
          return;
        }
        stdin = supplied;
      }

      const config = {
        stdio: {
          write: function(chunk) {
            stdout += String(chunk);
          }
        }
      };

      try {
        /*
         * JSCPP's browser API accepts:
         * run(sourceCode, stdin, config)
         */
        const result = JSCPPlib.run(code, stdin, config);
        if (typeof result === "number") exitCode = result;
      } catch (err) {
        exitCode = 1;
        stderr = err && err.message ? err.message : String(err);
      }

      const out = document.createElement("div");
      out.className = "console-out";

      let text = stdout;
      if (stderr) {
        text += (text ? "\n" : "") + "Error: " + stderr;
      }
      if (!text.trim()) {
        text = "(no output)";
      }

      out.textContent = text;

      if (exitCode !== 0) {
        const status = document.createElement("div");
        status.className = "note-box";
        status.textContent = "Process exited with code " + exitCode;
        body.innerHTML = "";
        body.appendChild(out);
        body.appendChild(status);
      } else {
        body.innerHTML = "";
        body.appendChild(out);
      }

    } catch(loadErr) {
      const note = document.createElement("div");
      note.className = "note-box";
      note.innerHTML =
        "<b>C/C++ runtime could not start.</b><br>" +
        "The browser C/C++ runtime is loaded when Run is pressed. " +
        "An internet connection is required the first time because " +
        "the JSCPP runtime is loaded from the configured CDN.<br><br>" +
        escapeHtml(loadErr.message || String(loadErr));
      body.innerHTML = "";
      body.appendChild(note);
    }
  }


  /* ---------------- Universal Run Engine ----------------
     Browser-native execution is kept for Web/JavaScript/Python/C/C++.
     Java, C#, PHP, Kotlin and Go are routed through an optional sandbox
     compiler endpoint. Configure it with window.MMITCS_EXECUTOR_URL or
     localStorage key mmitcs_executor_url.
  ---------------------------------------------------------- */

  const EXECUTOR_URL = window.MMITCS_EXECUTOR_URL || localStorage.getItem("mmitcs_executor_url") || "";
  const REMOTE_LANG = {java:"java",csharp:"csharp",php:"php",kotlin:"kotlin",go:"go"};

  function showConsoleResult(body,result){
    const out=document.createElement("div"); out.className="console-out";
    const run=result&&result.run?result.run:{};
    const stdout=run.stdout||"", stderr=run.stderr||"", code=run.code;
    let html=escapeHtml(stdout);
    if(stderr) html+=(html?"\n":"")+'<span class="err">'+escapeHtml(stderr)+"</span>";
    if(code!==null&&code!==undefined&&code!==0&&!stderr) html+=(html?"\n":"")+'<span class="err">Process exited with code '+escapeHtml(String(code))+"</span>";
    out.innerHTML=html||"(no output)"; body.innerHTML=""; body.appendChild(out);
  }

  async function runRemote(lang,code,body,label){
    label.textContent="Compiler Output";
    if(!EXECUTOR_URL){
      body.innerHTML=""; const note=document.createElement("div"); note.className="note-box";
      note.innerHTML="<b>"+escapeHtml(lang.name)+" needs its real compiler/runtime.</b><br>A normal HTML page cannot safely compile every native language. Connect a sandbox executor with <code>window.MMITCS_EXECUTOR_URL</code> or localStorage key <code>mmitcs_executor_url</code>. Editor, save, projects and download remain unchanged.";
      body.appendChild(note); return;
    }
    body.innerHTML='<div class="console-out">Starting '+escapeHtml(lang.name)+' compiler…</div>';
    try{
      const res=await fetch(EXECUTOR_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:REMOTE_LANG[lang.id]||lang.id,version:"*",files:[{name:"Main."+lang.ext,content:code}],stdin:""})});
      if(!res.ok) throw new Error("Compiler service returned HTTP "+res.status);
      showConsoleResult(body,await res.json());
    }catch(err){
      body.innerHTML=""; const note=document.createElement("div"); note.className="note-box";
      note.innerHTML='<span class="err">Compiler connection failed:</span> '+escapeHtml(err.message||String(err))+"<br>Check the executor URL/server. Your code is still saved locally."; body.appendChild(note);
    }
  }

  byId("runBackBtn").addEventListener("click",()=>showView("editor"));
  byId("runBtn").addEventListener("click",()=>{
    const lang=langById(state.currentLang), panel=byId("runPanel"), body=byId("runPanelBody"), label=byId("runPanelLabel");
    byId("runIcon").style.background=lang.color; byId("runIcon").innerHTML=lang.icon; byId("runTitle").textContent=lang.name+" — Run";
    panel.style.display="block"; body.innerHTML=""; showView("run");
    if(lang.kind==="web"){
      label.textContent="Live Preview"; const iframe=document.createElement("iframe"); iframe.className="preview"; iframe.setAttribute("sandbox","allow-scripts");
      iframe.srcdoc = `<!DOCTYPE html><html><head><style>${state.data.css}</style></head><body>${state.data.html}<script>${state.data.js}\<\/script></body></html>`;
      body.appendChild(iframe);
    }else if(lang.kind==="js"){
      label.textContent="Console Output"; const out=document.createElement("div"); out.className="console-out"; const logs=[];
      const fakeConsole={log:(...a)=>logs.push(a.map(String).join(" ")),error:(...a)=>logs.push('<span class="err">'+a.map(String).join(" ")+"</span>"),warn:(...a)=>logs.push(a.map(String).join(" "))};
      try{const fn=new Function("console",state.data.code); fn(fakeConsole); out.innerHTML=logs.length?logs.join("\n"):"(no output. use console.log())";}catch(err){out.innerHTML='<span class="err">Error: '+escapeHtml(err.message)+"</span>";} body.appendChild(out);
    }else if(lang.kind==="python") runPython(state.data.code,body,label);
    else if(lang.kind==="c"||lang.kind==="cpp") runCLike(state.data.code,body,label);
    else runRemote(lang,state.data.code,body,label);
  });

  /* ---------------- Download ---------------- */
  // Builds the download filename from the user's own project name, always
  // appending "MMITcs" at the end of that name (before the extension).
  function buildDownloadFilename(baseName, ext){
    const clean = (baseName || "").trim().replace(/[\\/:*?"<>|]+/g, "").trim();
    const name = clean || "project";
    return name + "-MMITcs." + ext;
  }

  byId("downloadBtn").addEventListener("click", () => {
    const lang = langById(state.currentLang);
    let content, filename;
    const userName = byId("projectNameInput").value;
    if (lang.kind === "web"){
      content = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<style>\n${state.data.css}\n</style>\n</head>\n<body>\n${state.data.html}\n<script>\n${state.data.js}\n<\/script>\n</body>\n</html>`;
      filename = buildDownloadFilename(userName, "html");
    } else {
      content = state.data.code;
      filename = buildDownloadFilename(userName, lang.ext);
    }
    const blob = new Blob([content], {type:"text/plain"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  /* ---------------- Init ---------------- */
  renderLangGrid();
  renderProjects();
  showView("home");

})();
</script>
</body>
</html>
