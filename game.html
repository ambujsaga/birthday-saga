<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* Same Firebase project as index.html -> same users, same XP */
const app = initializeApp({
  apiKey: "AIzaSyAegYu-tHbS662BnPV3pyTFBGoKw1jomMQ",
  authDomain: "mmitsce.firebaseapp.com",
  databaseURL: "https://mmitsce-default-rtdb.firebaseio.com",
  projectId: "mmitsce",
  storageBucket: "mmitsce.firebasestorage.app"
});
const db = getDatabase(app);

const TOTAL_LEVELS = 52, TOTAL_XP = 3000;
/* 52 levels ka XP: sab milake exactly 3000 (kuchh levels 57, kuchh 58) */
const LEVEL_XP = [];
for (let i = 0; i < TOTAL_LEVELS; i++) {
  LEVEL_XP.push(Math.floor(TOTAL_XP * (i + 1) / TOTAL_LEVELS) - Math.floor(TOTAL_XP * i / TOTAL_LEVELS));
}

const $ = id => document.getElementById(id);
const pad2 = n => (n < 10 ? '0' : '') + n;
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function isoWeekKey(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day + 3);
  const firstThursday = new Date(d.getFullYear(), 0, 4);
  const week = 1 + Math.round((d - firstThursday) / 86400000 / 7);
  return d.getFullYear() + '-W' + pad2(week);
}

let localUser = null;
try { localUser = JSON.parse(localStorage.getItem('portalUser') || 'null'); } catch (e) {}
if (localUser && !localUser.rollNumber) localUser = null;
const myRoll = () => localUser ? String(localUser.rollNumber) : null;
/* ADDITIVE: Guest mode (roll number nahi, XP nahi) */
let isGuest = false;
try { isGuest = !localUser && localStorage.getItem('portalGuest') === '1'; } catch (e) {}

/* ---------- Login ---------- */
const errEl = $('gLoginError'), loginBtn = $('gLoginBtn'), rollInput = $('gLoginRoll');
['selectstart', 'contextmenu'].forEach(t => rollInput.addEventListener(t, e => e.stopPropagation()));

async function processLogin(){
  const roll = rollInput.value.trim();
  errEl.textContent = '';
  if (!roll) { errEl.textContent = 'Please enter your Roll Number.'; return; }
  if (/[.#$\[\]\/]/.test(roll)) { errEl.textContent = 'Invalid Roll Number.'; return; }
  loginBtn.disabled = true; loginBtn.textContent = 'Checking...';
  try {
    const snap = await get(ref(db, 'portal/users/' + roll));
    const u = snap.val();
    if (!u) { errEl.textContent = 'Invalid Roll Number. This user has not been added by the admin.'; return; }
    if (u.forceLogout) {
      errEl.textContent = 'You have been logged out by the admin. Please try again later or contact your admin.';
      try { await remove(ref(db, 'portal/users/' + roll + '/forceLogout')); } catch (e) {}
      return;
    }
    const user = Object.assign({}, u, { rollNumber: u.rollNumber || roll });
    localStorage.setItem('portalUser', JSON.stringify(user));
    try { localStorage.removeItem('portalGuest'); } catch (e) {}
    /* game is user ke progress ke saath dobara start hoga */
    location.reload();
  } catch (e) {
    console.error(e);
    errEl.textContent = 'Network error. Please check your internet and try again.';
  } finally {
    loginBtn.disabled = false; loginBtn.textContent = 'Secure Login';
  }
}
loginBtn.addEventListener('click', processLogin);
$('gGuestBtn').addEventListener('click', () => {
  try { localStorage.removeItem('portalUser'); localStorage.setItem('portalGuest', '1'); } catch (e) {}
  location.reload();
});
rollInput.addEventListener('keydown', e => { if (e.key === 'Enter') processLogin(); });

function logout(){
  try { localStorage.removeItem('portalUser'); localStorage.removeItem('portalGuest'); } catch (e) {}
  location.reload();
}
$('gpLogout').addEventListener('click', logout);

/* ---------- Profile card (real time) ---------- */
let myEng = null;
function renderProfile(){
  if (isGuest && !localUser) {
    $('gpName').textContent = 'Guest';
    $('gpRoll').textContent = 'Guest';
    $('gpAvatar').textContent = 'G';
    $('gpXpStat').style.display = 'none';          // guest ke liye XP nahi
    const glv = (window.gameCompletedLevels ? window.gameCompletedLevels().length : 0);
    $('gpLevels').textContent = glv;
    $('gpLevelMax').textContent = TOTAL_LEVELS;
    $('gpBar').style.width = Math.min(100, Math.round(glv / TOTAL_LEVELS * 100)) + '%';
    $('gProfile').classList.add('gp-on');
    return;
  }
  const u = localUser; if (!u) return;
  $('gpXpStat').style.display = '';
  const name = u.name || ('Roll ' + u.rollNumber);
  $('gpName').textContent = name;
  $('gpRoll').textContent = u.rollNumber;
  $('gpAvatar').textContent = String(name).trim().charAt(0).toUpperCase() || '?';
  const xp = (myEng && myEng.xp) || 0;
  const lv = (myEng && myEng.gameLevels) ? Object.keys(myEng.gameLevels).length : 0;
  $('gpXp').textContent = xp;
  $('gpLevels').textContent = lv;
  $('gpLevelMax').textContent = TOTAL_LEVELS;
  $('gpBar').style.width = Math.min(100, Math.round(lv / TOTAL_LEVELS * 100)) + '%';
  $('gProfile').classList.add('gp-on');
}

/* ---------- XP: har level ka XP sirf ek baar, index.html ke same XP me add hota hai ---------- */
window.awardLevelXP = async function(lv, silent){
  const roll = myRoll();
  if (!roll && isGuest) { renderProfile(); return 0; }   // guest: XP nahi, sirf levels count refresh
  if (!roll || !(lv >= 0 && lv < TOTAL_LEVELS)) return 0;
  const toast = $('gXpGain');
  if (!silent && toast) toast.textContent = '';
  const amt = LEVEL_XP[lv];
  let gained = 0, total = 0;
  try {
    const res = await runTransaction(ref(db, 'portal/engagement/users/' + roll), cur => {
      cur = cur || {};
      const gl = cur.gameLevels || {};
      if (gl[lv]) return;                       // is level ka XP pehle mil chuka -> kuchh nahi
      gl[lv] = amt;
      cur.gameLevels = gl;
      cur.xp = (cur.xp || 0) + amt;             // index.html ka All-Time XP
      const wk = isoWeekKey(todayStr());
      const w = cur.weeklyXP || {};
      w[wk] = (w[wk] || 0) + amt;               // index.html ka Weekly XP
      cur.weeklyXP = w;
      return cur;
    });
    if (res.committed) { gained = amt; total = res.snapshot.val().xp || 0; }
  } catch (e) { console.error('XP update failed', e); }
  if (gained && !silent && toast) toast.textContent = '⚡ +' + gained + ' XP  (Total ' + total + ')';
  return gained;
};

/* ---------- Start: validate user + live listeners ---------- */
if (localUser) {
  const roll = myRoll();
  let synced = false;
  onValue(ref(db, 'portal/users/' + roll), snap => {
    const u = snap.val();
    if (!u) { alert('Your account was removed by the admin.'); logout(); return; }
    if (u.forceLogout) {
      remove(ref(db, 'portal/users/' + roll + '/forceLogout')).catch(() => {});
      alert('You have been logged out by the admin.');
      logout(); return;
    }
    localUser = Object.assign({}, u, { rollNumber: u.rollNumber || roll });
    try { localStorage.setItem('portalUser', JSON.stringify(localUser)); } catch (e) {}
    renderProfile();
  });
  onValue(ref(db, 'portal/engagement/users/' + roll), async snap => {
    myEng = snap.val() || {};
    renderProfile();                              // XP real time (index.html me bhi yahi XP badhta hai)
    if (!synced) {
      synced = true;                              // purane completed levels ka XP ek baar sync
      const done = (window.gameCompletedLevels ? window.gameCompletedLevels() : []);

} else if (isGuest) {

        function drawAnim(){
            ctx.clearRect(0,0,w,h);
            ctx.beginPath();
            ctx.moveTo(0,0);
            for(var n = 0; n < curvePoints.length; n++){
                ctx.lineTo(curvePoints[n]-dx,fy*n);
            }
            ctx.lineTo(0,h);
            ctx.fill();
            ctx.closePath();
            ctx.beginPath();
            ctx.moveTo(w,0);
            for(var n = 0; n < curvePoints.length; n++){
                ctx.lineTo(curvePoints[n]+dx,fy*n);
            }
            ctx.lineTo(w,h);
            ctx.fill();
            ctx.closePath();
            dx+=10;

    function synthSfx(x){
        //respect the Tap Sound OFF switch
        if(typeof sfxOn !== "undefined" && !sfxOn){ return; }
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC || !SFX[x]){ return; }
        try{
            if(!sCtx){ sCtx = new AC(); }
            if(sCtx.state === "suspended"){ sCtx.resume(); }
            var t0 = sCtx.currentTime + 0.01;
            SFX[x].forEach(function(n){
                var o = sCtx.createOscillator();
                var g = sCtx.createGain();
                o.type = n[3];
                o.frequency.value = n[0];
                g.gain.setValueAtTime(0.0001,t0 + n[1]);
                g.gain.linearRampToValueAtTime(0.35,t0 + n[1] + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001,t0 + n[1] + n[2]);
                o.connect(g);
                g.connect(sCtx.destination);
                o.start(t0 + n[1]);
                o.stop(t0 + n[1] + n[2] + 0.05);
            });
        }
        catch(err){}
    }

    var mCtx = null, mMaster = null, mTimer = null, mNext = 0, mStep = 0;
    var M_EIGHTH = 60 / 104 / 2;
    var M_PROG = [
        {b:48, t:[60,64,67,72]},
        {b:45, t:[57,60,64,69]},
        {b:41, t:[57,60,65,69]},
        {b:43, t:[55,59,62,67]}
    ];
    var M_ARP = [0,1,2,3,2,1,2,1];
    var M_PENTA = [72,74,76,79,81,84];
    
    function mFreq(n){
        return 440 * Math.pow(2,(n - 69) / 12);
    }
    
    function mInit(){
        if(mCtx){ return true; }
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC){ return false; }
        try{
            mCtx = new AC();
            mMaster = mCtx.createGain();
            mMaster.gain.value = 0.35;
            mMaster.connect(mCtx.destination);
        }
        catch(err){
            mCtx = null;
            return false;
        }
        return true;
    }
    
    function mNote(midi,time,dur,type,vol){
        var o = mCtx.createOscillator();
        var g = mCtx.createGain();
        o.type = type;
        o.frequency.value = mFreq(midi);
        g.gain.setValueAtTime(0.0001,time);
        g.gain.linearRampToValueAtTime(vol,time + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,time + dur);
        o.connect(g);
        g.connect(mMaster);
        o.start(time);
        o.stop(time + dur + 0.05);
    }
    
    function mSchedule(){
        if(!mCtx){ return; }
        while(mNext < mCtx.currentTime + 0.3){
            var st = mStep % 32;
            var bar = M_PROG[Math.floor(st / 8) % 4];
            var s = st % 8;
            mNote(bar.t[M_ARP[s]],mNext,M_EIGHTH * 1.6,"triangle",0.16);
            if(s === 0 || s === 4){
                mNote(bar.b,mNext,M_EIGHTH * 3.5,"sine",0.28);
            }
            if((s === 0 || s === 3 || s === 6) && Math.random() < 0.7){
                var mn = M_PENTA[Math.floor(Math.random() * M_PENTA.length)];
                mNote(mn,mNext,M_EIGHTH * 2.2,"sine",0.1);
            }
            mNext += M_EIGHTH;
            mStep++;
        }
    }
    
    function musicStart(){
        if(!mInit()){ return; }
        try{ mCtx.resume(); }
        catch(err){}
        if(mTimer){ return; }
        mNext = mCtx.currentTime + 0.05;
        mTimer = setInterval(mSchedule,100);
    }
    
    function musicStop(){
        if(mTimer){
            clearInterval(mTimer);
            mTimer = null;
        }
    }

        if(R.hp <= 0){ rHP(); setTimeout(rLose,600); return; }
        R.int = rIn(); R.busy = false; rHP();
    }
    function rWin(){
        if(!R.on){ return; }
        var c = 25 * (R.st + 1), b = lsNum(LS_RB,0);
        updateCoin(c);
        if(R.st + 1 > b){ lsSet(LS_RB,R.st + 1); }
        refreshHome2(); play("levelComplete");
        if(R.st >= EN.length - 1){ updateCoin(100); showModal("🏆 Story Complete!","You defeated the Demon King!<br>+" + (c + 100) + " 💰",[["Play Again",rStart],["Home",leave]]); }
        else { showModal("⚔ Victory!",R.e.n + " defeated!<br>+" + c + " 💰",[["Next Battle",function(){ hideModal(); R.hp = Math.min(R.mh,R.hp + 25); rNew(R.st + 1); }],["Home",leave]]); }
    }
    function rLose(){
        if(!R.on){ return; }
        play("wrong");
        showModal("💀 Defeated","You fell at stage " + (R.st + 1) + ".",[["Retry",rStart],["Home",leave]]);
    }

    //---------- Physics Falling / Floating Letters ----------
    var PR = 22, P = {L:[],s:[],on:false};
    var pcv = _s("pcv"), px = pcv.getContext("2d");
    function pGo(m){
        hideModal(); P.on = false; openPg(pagePhys);
        var me = P = {mode:m,L:[],s:[],sc:0,lv:6,el:0,nx:0.4,q:[],cb:0,lw:0,on:true,dn:false,pt:[0,0]}, last = performance.now();
        function fr(t){
            if(P !== me || !me.on){ return; }
            pStep(Math.min(0.033,(t - last) / 1000)); last = t;
            pDraw();
            requestAnimationFrame(fr);
        }
        requestAnimationFrame(fr);
    }
    function pStep(dt){
        var W = P.mode === "w", sy = h * 0.36, L = P.L, i, j, o;
        P.el += dt; P.nx -= dt;
        if(P.nx <= 0 && L.length < 15){
            P.nx = Math.max(0.55,1.25 - P.el / 100);
            if(!P.q.length){ P.q = P.q.concat(pick(POOL).split(""),[rl()]); shuf(P.q); }   //letters come from real words, so words are always possible
            L.push({c:P.q.pop(),x:PR + Math.random() * (w - 2 * PR),y:-PR,vy:30,sh:0});
        }
        for(i = 0; i < L.length; i++){
            o = L[i];
            if(W && o.y > sy){ o.vy += (16 + P.el * 0.25 - o.vy) * 3 * dt; o.x += Math.sin(P.el * 2 + i) * 14 * dt; }   //water: floats, slowly sinks
            else { o.vy = Math.min(o.vy + (W ? 420 : 190) * dt,W ? 300 : 85 + P.el * 0.8); }                          //air: gravity
            o.y += o.vy * dt; o.sh = Math.max(0,o.sh - dt);
        }
        for(i = 0; i < L.length; i++){ for(j = i + 1; j < L.length; j++){
            var a = L[i], b = L[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx,dy);
            if(d > 0 && d < 2 * PR){ var f = (2 * PR - d) / 2 / d; a.x -= dx * f; a.y -= dy * f; b.x += dx * f; b.y += dy * f; }
        } }
        for(i = L.length - 1; i >= 0; i--){
            o = L[i]; o.x = Math.max(PR,Math.min(w - PR,o.x));
            if(o.y > h - PR){
                L.splice(i,1); P.s = P.s.filter(function(x){ return x !== o; }); P.lv--; play("wrong");
                if(P.lv <= 0){ pOver(); return; }
            }
        }
    }
    function pDraw(){
        var W = P.mode === "w", t = container.style.getPropertyValue("--tile") || "#21c7d6", x, wd;
        px.clearRect(0,0,w,h);
        if(W){ var sy = h * 0.36; px.fillStyle = "rgba(30,120,220,.4)"; px.beginPath(); px.moveTo(0,h); px.lineTo(0,sy); for(x = 0; x <= w; x += 20){ px.lineTo(x,sy + Math.sin(P.el * 2 + x / 30) * 5); } px.lineTo(w,h); px.fill(); }
        px.font = "800 22px arial"; px.textAlign = "center"; px.textBaseline = "middle";
        P.L.forEach(function(o){
            var ox = o.sh > 0 ? Math.sin(o.sh * 60) * 4 : 0, on = P.s.indexOf(o) > -1;
            px.beginPath(); px.arc(o.x + ox,o.y,PR,0,7); px.fillStyle = on ? "#ffd54a" : (o.y > h * 0.8 ? "#e11d48" : t); px.fill();
            px.lineWidth = 2; px.strokeStyle = "#000"; px.stroke();
            px.fillStyle = on ? "#000" : "#fff"; px.fillText(o.c,o.x + ox,o.y + 1);
        });
        if(P.s.length){
            px.beginPath(); px.strokeStyle = "rgba(255,213,74,.9)"; px.lineWidth = 6; px.lineCap = "round";
            P.s.forEach(function(o,i){ if(i){ px.lineTo(o.x,o.y); } else { px.moveTo(o.x,o.y); } });
            if(P.dn){ px.lineTo(P.pt[0],P.pt[1]); }
            px.stroke();
        }
        wd = P.s.map(function(o){ return o.c; }).join("");
        _s("pHud").innerHTML = "⭐ " + P.sc + " &nbsp; " + new Array(Math.max(0,P.lv) + 1).join("❤") + (P.cb > 1 && Date.now() - P.lw < 3500 ? " &nbsp;🔥x" + P.cb : "") + (wd ? "<br><span style='font-size:22px;color:#ffd54a'>" + wd + "</span>" : "");
    }
    function pOver(){
        P.on = false;
        var b = lsNum(LS_PB,0), nb = P.sc > b, c = Math.floor(P.sc / 10), m = P.mode;
        if(nb){ lsSet(LS_PB,P.sc); }
        if(c){ updateCoin(c); }
        play("levelComplete"); refreshHome2();
        showModal("🌊 Game Over","Score: <b>" + P.sc + "</b>" + (nb ? " 🏆 NEW BEST!" : "<br>Best: " + b) + "<br>+" + c + " 💰",[["Play Again",function(){ pGo(m); }],["Home",leave]]);
    }
    function pAt(e){ var r = pcv.getBoundingClientRect(); return [(e.clientX - r.left) * w / r.width,(e.clientY - r.top) * h / r.height]; }
    function pAdd(p){
        var o = null, l = P.s[P.s.length - 1], i;
        for(i = P.L.length - 1; i >= 0; i--){ if(Math.hypot(P.L[i].x - p[0],P.L[i].y - p[1]) < PR + 8){ o = P.L[i]; break; } }
        if(o && P.s.indexOf(o) < 0 && (!l || Math.hypot(o.x - l.x,o.y - l.y) < 115)){ P.s.push(o); play("select"); }
    }
    function pSub(){
        var s = P.s, wd = s.map(function(o){ return o.c; }).join(""), n;
        P.dn = false;
        if(wd.length >= 3 && WORDS[wd]){
            P.L = P.L.filter(function(o){ return s.indexOf(o) < 0; });
            n = Date.now(); P.cb = (n - P.lw < 3500) ? Math.min(P.cb + 1,3) : 1; P.lw = n;   //rapid-fire combo up to x3
            P.sc += wd.length * wd.length * P.cb; play("right");
        }
        else if(wd.length){ s.forEach(function(o){ o.sh = 0.3; }); play("wrong"); }
        P.s = [];
    }
    pcv.addEventListener("pointerdown",function(e){ e.preventDefault(); if(!P.on){ return; } P.dn = true; P.s = []; P.pt = pAt(e); pAdd(P.pt); });
    pcv.addEventListener("pointermove",function(e){ if(!P.dn){ return; } P.pt = pAt(e); pAdd(P.pt); });
    ["pointerup","pointercancel"].forEach(function(t){ pcv.addEventListener(t,function(){ if(P.dn){ pSub(); } }); });

    //first 5 launches of each new mode show an English "How to Play" guide
    var TUT_MAX = 5;
    function tutor(key,title,html,go){
        var n = lsNum("cba_tut_" + key,0);
        if(n >= TUT_MAX){ go(); return; }
        lsSet("cba_tut_" + key,n + 1);
        showModal("📖 " + title,"<div style='text-align:left;font-size:14px'>" + html + "</div><div style='font-size:12px;color:#888;margin-top:8px'>Guide " + (n + 1) + " of " + TUT_MAX + "</div>",[["Got it, Play!",go],["Back",hideModal]]);
    }
    var RPG_HELP = "<b>How to play</b><br>1️⃣ Tap letters to build a word (tap the last letter again to undo).<br>2️⃣ Press <b>⚔ Cast</b> — your word becomes your hero's action.<br>3️⃣ Special words:<br>&nbsp;🔥 <b>FIRE</b> = fire attack (extra damage)<br>&nbsp;❄ <b>ICE</b> = freezes the enemy for a turn<br>&nbsp;✨ <b>HEAL</b> = restores your HP<br>&nbsp;🛡 <b>SHIELD</b> = blocks enemy damage<br>4️⃣ Any other real word is a normal attack. Longer words and rare letters (J, X, Q, Z) hit harder.<br>5️⃣ The enemy's next move is shown above it — plan ahead!<br>6️⃣ <b>🔄</b> gives new letters but costs your turn. <b>✖</b> clears the word.<br>Win battles to earn coins!";
    var PHYS_HELP = "<b>How to play</b><br>1️⃣ Letters fall from the top. <b>Gravity</b> mode drops them fast; <b>Water</b> mode makes them float and slowly sink.<br>2️⃣ Put your finger on a letter and swipe across touching letters to spell a word (3+ letters).<br>3️⃣ Lift your finger to submit. Correct words clear the letters and score points.<br>4️⃣ Don't let letters reach the bottom — each one costs a ❤ (you have 6). Letters turn red when close!<br>5️⃣ Make words quickly one after another for a 🔥 combo up to x3.<br>Longer words = more points. Every 10 points = 1 coin.";

    //Home buttons
    var rB = document.createElement("button"), pB = document.createElement("button");
    rB.className = "modeBtn rpgBtn xBtnS"; pB.className = "modeBtn physBtn xBtnS";
    function refreshHome2(){
        rB.innerHTML = "⚔️ Story Mode<small>Word Battles · Best stage " + lsNum(LS_RB,0) + "/" + EN.length + "</small>";
        pB.innerHTML = "🌊 Falling Letters<small>Gravity &amp; Water · Best " + lsNum(LS_PB,0) + "</small>";
    }
    rB.addEventListener("click",function(){
        showModal("⚔️ Story Mode","Your word is your hero's action!<br>🔥 FIRE = fire attack · ❄ ICE = freeze<br>✨ HEAL = recover · 🛡 SHIELD = defense<br>Longer &amp; rarer words hit harder. Beat 5 enemies!",[["Start",function(){ tutor("rpg","Story Mode Guide",RPG_HELP,function(){ hideModal(); openPg(pageRpg); R.hp = R.mh = 100; rNew(0); }); }],["Cancel",hideModal]]);
    });
    pB.addEventListener("click",function(){
        showModal("🌊 Falling Letters","Letters fall or float and sink. Swipe across letters to spell 3+ letter words before they touch the bottom! 6 lives.<br>Best: " + lsNum(LS_PB,0),[["⬇ Gravity",function(){ tutor("phys","Falling Letters Guide",PHYS_HELP,function(){ pGo("g"); }); }],["🌊 Water",function(){ tutor("phys","Falling Letters Guide",PHYS_HELP,function(){ pGo("w"); }); }],["Cancel",hideModal]]);
    });
    pageHome.appendChild(rB);
    pageHome.appendChild(pB);
    refreshHome2();

    container.style.display = "block";
}
</script>

<script>
(function(){
    var d=document;
    // Block long-press menu / text selection
    d.addEventListener("contextmenu",function(e){e.preventDefault();});

    ["gesturestart","gesturechange","gestureend"].forEach(function(t){
        d.addEventListener(t,function(e){e.preventDefault();});
    });
    d.addEventListener("touchmove",function(e){
        if(e.touches && e.touches.length>1) e.preventDefault();
    },{passive:false});

    d.addEventListener("wheel",function(e){if(e.ctrlKey) e.preventDefault();},{passive:false});
