<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Soon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--sky1:#141a4a;--sky2:#5b3f8f;--sky3:#f08a5d;--sun:#ffc15e;--ink:#fff4e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);
background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.sun{position:fixed;left:50%;bottom:0;width:min(60vw,320px);aspect-ratio:1;border-radius:50%;z-index:1;
background:radial-gradient(circle at 50% 40%,#fff3c4,var(--sun) 60%,#ff9a52);
box-shadow:0 0 90px 30px rgba(255,193,94,.45);transform:translate(-50%,var(--y,80%));transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.hill{position:fixed;left:0;right:0;bottom:0;height:18vh;background:#0d1033;z-index:2;
clip-path:polygon(0 55%,18% 30%,40% 55%,62% 22%,82% 50%,100% 28%,100% 100%,0 100%)}
main{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:76px 20px 22vh}
h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,6rem);line-height:1.05;margin:0 0 14px;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 18px rgba(13,16,51,.65),0 0 2px rgba(13,16,51,.8)}
h1 .w{display:inline-block;white-space:nowrap}
h1 .l{display:inline-block;opacity:0;transform:translateY(40px) rotate(6deg);animation:rise .8s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes rise{to{opacity:1;transform:none}}
p.sub{text-shadow:0 1px 10px rgba(13,16,51,.7);max-width:34ch;margin:0 0 28px;font-size:1.1rem;opacity:.9}
.clock{display:flex;gap:clamp(8px,3vw,20px)}
.unit{width:clamp(66px,19vw,110px);padding:14px 0 10px;border-radius:18px;background:rgba(13,16,51,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,244,230,.25)}
.num{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(1.9rem,8vw,3.4rem);display:block;font-variant-numeric:tabular-nums}
.num.tick{animation:tick .45s ease}
@keyframes tick{0%{transform:translateY(-35%) scaleY(.6);opacity:0}100%{transform:none;opacity:1}}
.lbl{font-size:.8rem;opacity:.8}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.home{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;color:var(--ink);text-decoration:none;font-weight:500;background:rgba(13,16,51,.5);backdrop-filter:blur(6px);border:1px solid rgba(255,244,230,.3);transition:transform .15s}
.home:hover{transform:translateY(-2px)}
.home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){h1 .l{animation:none;opacity:1;transform:none}.num.tick{animation:none}.sun{transition:none}}
/* ---- Added: background animation (clouds, shooting stars, sun glow, sky shimmer) ---- */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;left:0;height:46px;border-radius:999px;background:rgba(255,244,230,.14);filter:blur(6px);
animation:drift linear infinite;will-change:transform}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:150%;left:12%;top:-60%}
.cloud::after{width:40%;height:120%;right:14%;top:-40%}
.c1{top:14%;width:190px;animation-duration:70s;animation-delay:-20s}
.c2{top:30%;width:260px;animation-duration:95s;animation-delay:-60s;opacity:.8}
.c3{top:46%;width:150px;animation-duration:60s;animation-delay:-5s;opacity:.7}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(calc(100vw + 100px))}}
#shoot{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sun{animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 80px 24px rgba(255,193,94,.38)}to{box-shadow:0 0 120px 44px rgba(255,193,94,.58)}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(60% 40% at 50% 100%,rgba(240,138,93,.35),transparent 70%);animation:shimmer 8s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.cloud,.sun,body::before{animation:none}.cloud{transform:translateX(20vw)}#shoot{display:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="shoot" aria-hidden="true"></canvas>
<div class="bg-fx" aria-hidden="true"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
<div class="sun" id="sun" aria-hidden="true"></div>
<div class="hill" aria-hidden="true"></div>
<a class="home" href="index.html" aria-label="Go to home page">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  <span>Home</span>
</a>
<main>
  <h1 id="title" aria-label="Coming soon"></h1>
  <p class="sub">Something new is on the way. Be the first to know when we launch.</p>
  <div class="clock" role="timer" aria-live="off">
    <div class="unit"><span class="num" id="d">00</span><span class="lbl">Days</span></div>
    <div class="unit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit"><span class="num" id="m">00</span><span class="lbl">Minutes</span></div>
    <div class="unit"><span class="num" id="s">00</span><span class="lbl">Seconds</span></div>
  </div>
</main>
<script>
// Title letters rise one by one
var t=document.getElementById('title');
var idx=0;
"Coming soon".split(' ').forEach(function(word,wi){
  var w=document.createElement('span');w.className='w';
  word.split('').forEach(function(c){
    var l=document.createElement('span');l.className='l';l.textContent=c;
    l.style.animationDelay=(0.3+idx++*0.05)+'s';w.appendChild(l);
  });
  t.appendChild(w);
  if(wi===0)t.appendChild(document.createTextNode(' '));
});

// Countdown: update goes live on 9 October 2026 (00:00, viewer's local time). Change 'target' to edit.
var start=Date.now();
var target=new Date(2026,9,9,0,0,0).getTime();
var prev={};
function pad(n){return String(n).padStart(2,'0')}
function set(id,v){
  var el=document.getElementById(id),val=pad(v);
  if(prev[id]!==val){el.textContent=val;el.classList.remove('tick');void el.offsetWidth;el.classList.add('tick');prev[id]=val}
}
function update(){
  var left=Math.max(0,target-Date.now());
  set('d',Math.floor(left/864e5));
  set('h',Math.floor(left/36e5)%24);
  set('m',Math.floor(left/6e4)%60);
  set('s',Math.floor(left/1e3)%60);
  // Sun rises as launch gets closer
  var p=1-left/(target-start);
  document.getElementById('sun').style.setProperty('--y',(80-p*60)+'%');
}
update();setInterval(update,1000);
// Demo: lift the sun slightly at the start
setTimeout(function(){document.getElementById('sun').style.setProperty('--y','45%')},300);
setTimeout(update,2200);

// Twinkling stars
var cv=document.getElementById('stars'),cx=cv.getContext('2d'),stars=[];
function resize(){cv.width=innerWidth;cv.height=innerHeight;
  stars=Array.from({length:110},function(){return{x:Math.random()*cv.width,y:Math.random()*cv.height*.7,r:Math.random()*1.6+.3,p:Math.random()*6.28}})}
resize();addEventListener('resize',resize);
var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(t){
  cx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(function(s){
    cx.globalAlpha=0.35+0.65*Math.abs(Math.sin(t/900+s.p));
    cx.fillStyle='#fff4e6';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.28);cx.fill();
  });
  if(!still)requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// Added: shooting stars
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var c=document.getElementById('shoot'),x=c.getContext('2d'),list=[],next=0;
  function rs(){c.width=innerWidth;c.height=innerHeight}
  rs();addEventListener('resize',rs);
  function loop(t){
    x.clearRect(0,0,c.width,c.height);
    if(t>next){
      list.push({x:Math.random()*c.width*.8+c.width*.2,y:Math.random()*c.height*.3,vx:-7-Math.random()*4,vy:3+Math.random()*2,life:1});
      next=t+2500+Math.random()*4000;
    }
    list=list.filter(function(s){
      s.x+=s.vx;s.y+=s.vy;s.life-=.015;
      if(s.life<=0)return false;
      var g=x.createLinearGradient(s.x,s.y,s.x-s.vx*8,s.y-s.vy*8);
      g.addColorStop(0,'rgba(255,244,230,'+s.life+')');g.addColorStop(1,'rgba(255,244,230,0)');
      x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(s.x,s.y);x.lineTo(s.x-s.vx*8,s.y-s.vy*8);x.stroke();
      return true;
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
