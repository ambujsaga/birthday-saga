<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Jaya Bits</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg?v=1.1">
    <link rel="apple-touch-icon" sizes="192x192" href="logo.jpg?v=1.1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050506;
            --text: #F5F4F1;
            --muted: #A6A6AD;
            --accent: #FF3D68;
            --accent-soft: rgba(255,61,104,0.16);
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.14);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        .app-header {
            position: fixed;
            top: 0; width: 100%; z-index: 100;
            padding: 22px 20px 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            pointer-events: none;
            text-align: center;
        }
        .app-header h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        .app-header h1 span { color: var(--accent); }

        .back-button {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px 9px 12px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--text);
            text-decoration: none;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            font-size: 13px;
            font-weight: 500;
            transition: background 0.25s ease, transform 0.25s ease;
        }
        .back-button:hover { background: rgba(255,255,255,0.16); transform: translateX(-2px); }
        .back-button svg { display: block; }

        @media (max-width: 480px) {
            .back-button span { display: none; }
            .back-button { padding: 10px; border-radius: 50%; }
        }

        .reels-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-card {
            position: relative;
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: reelIn 0.5s ease forwards;
        }
        @keyframes reelIn { to { opacity: 1; } }

        .video-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            pointer-events: auto;
        }

        iframe {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: none;
        }

        .overlay-info {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 90px 20px 30px;
            z-index: 10;
            pointer-events: none;
            background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
        }
        .overlay-info h3 {
            font-family: 'Sora', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 6px;
            max-width: 85%;
        }
        .overlay-info span { color: var(--accent); font-weight: 600; font-size: 0.85rem; }

        #loader {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: none; align-items: center; gap: 10px;
            padding: 10px 18px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            z-index: 1000; font-size: 12px; color: var(--muted);
        }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #customAlert {
            display: none;
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 22px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            color: var(--text);
            border-radius: 30px;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            z-index: 1000;
        }

        #emptyState {
            display: none;
            position: fixed; inset: 0;
            flex-direction: column; align-items: center; justify-content: center;
            gap: 8px; text-align: center; padding: 0 30px;
            z-index: 50;
        }
        #emptyState h2 { font-family: 'Sora', sans-serif; font-size: 1.1rem; }
        #emptyState p { color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>The Jaya <span>Bits</span></h1>
    </header>

    <a href="index.html" class="back-button">
        <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path>
        </svg>
        <span>Back</span>
    </a>

    <div class="reels-container" id="reelsContainer"></div>

    <div id="emptyState">
        <h2>Couldn't load bits</h2>
        <p>Check your connection and reload the page.</p>
    </div>

    <div id="loader"><div class="spinner"></div><span>Loading more bits…</span></div>

    <div id="customAlert">Tap the screen to enable audio</div>

    <script>
        const API_KEY = 'AIzaSyDudljWyHUaPhUW1Ux3NeSHZQkRU1fVFcc';
        const container = document.getElementById('reelsContainer');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('emptyState');

        let nextPageToken = '';
        let isFetching = false;
        let hasLoadedOnce = false;

        const regions = ['IN', 'US', 'GB', 'JP', 'BR', 'KR', 'FR'];
        const randomRegion = regions[Math.floor(Math.random() * regions.length)];

        // Sizes an iframe like CSS object-fit: cover, so the video always fills the full screen
        function fitIframe(iframe) {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const videoRatio = 16 / 9;
            const winRatio = winW / winH;
            let w, h;
            if (winRatio > videoRatio) {
                w = winW;
                h = w / videoRatio;
            } else {
                h = winH;
                w = h * videoRatio;
            }
            iframe.style.width = w + 'px';
            iframe.style.height = h + 'px';
        }

        window.addEventListener('resize', () => {
            document.querySelectorAll('iframe').forEach(fitIframe);
        });

        const observerOptions = { root: container, threshold: 0.8 };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const iframe = entry.target.querySelector('iframe');
                if (iframe && iframe.contentWindow) {
                    if (entry.isIntersecting) {
                        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                        iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                    } else {
                        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                        iframe.contentWindow.postMessage('{"event":"command","func":"mute","args":""}', '*');
                    }
                }
            });
        }, observerOptions);

        async function fetchVideos(pageToken = '') {
            if (isFetching) return;
            isFetching = true;
            loader.style.display = 'flex';

            try {
                const url = `https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,status&chart=mostPopular&maxResults=10&regionCode=${randomRegion}&key=${API_KEY}&pageToken=${pageToken}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length) {
                    nextPageToken = data.nextPageToken;
                    const embeddableVideos = data.items.filter(v =>
                        v.status.embeddable !== false &&
                        v.snippet.liveBroadcastContent === 'none' // only finished trending videos, no live/upcoming
                    );
                    renderReels(embeddableVideos);
                    hasLoadedOnce = true;
                } else if (!hasLoadedOnce) {
                    emptyState.style.display = 'flex';
                }
            } catch (error) {
                console.error("API Error:", error);
                if (!hasLoadedOnce) emptyState.style.display = 'flex';
            } finally {
                isFetching = false;
                loader.style.display = 'none';
            }
        }

        function renderReels(videos) {
            videos.forEach((video) => {
                const id = video.id;
                const title = video.snippet.title;

                const reel = document.createElement('div');
                reel.classList.add('reel-card');

                reel.innerHTML = `
                    <div class="video-wrapper">
                        <iframe
                            src="https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&modestbranding=1&rel=0"
                            allow="autoplay; encrypted-media"
                            allowfullscreen>
                        </iframe>
                    </div>
                    <div class="overlay-info">
                        <h3>${title.substring(0, 60)}</h3>
                        <span>@thejayabits</span>
                    </div>
                `;
                container.appendChild(reel);
                fitIframe(reel.querySelector('iframe'));
                observer.observe(reel);
            });
        }

        container.addEventListener('scroll', () => {
            if (container.scrollTop + container.clientHeight >= container.scrollHeight - 200) {
                if (nextPageToken) fetchVideos(nextPageToken);
            }
        });

        fetchVideos();

        // Prompt for audio once, a few seconds after load
        window.addEventListener('load', () => {
            setTimeout(() => {
                const alertBox = document.getElementById('customAlert');
                alertBox.style.display = 'block';
                setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
            }, 2500);
        });

        document.body.addEventListener('click', function() {
            document.getElementById('customAlert').style.display = 'none';
            const activeReel = document.querySelector('.reel-card');
            if (activeReel) {
                const iframe = activeReel.querySelector('iframe');
                iframe.contentWindow.postMessage('{"event":"command","func":"unMute","args":""}', '*');
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            }
        }, { once: true });
    </script>
</body>
</html>
