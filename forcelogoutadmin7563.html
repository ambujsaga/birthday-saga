<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Force Logout Admin Panel</title>
<style>
  :root{
    --primary-blue:#003366;
    --accent-orange:#ff9900;
    --bg-color:#f4f6f9;
    --text-dark:#333;
    --card-bg:#ffffff;
    --danger:#c0392b;
    --ok:#2e7d32;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  body{background:var(--bg-color);color:var(--text-dark);min-height:100vh;}
  .topbar{background:var(--primary-blue);color:#fff;padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 6px rgba(0,0,0,0.1);}
  .topbar h1{font-size:1.05rem;letter-spacing:0.3px;}
  .topbar p{font-size:0.75rem;color:#cbd5e1;margin-top:2px;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

  /* ---------- login ---------- */
  .login-box{background:var(--card-bg);border-radius:10px;padding:22px;box-shadow:0 4px 14px rgba(0,0,0,0.08);margin-top:40px;}
  .login-box h2{font-size:1.1rem;margin-bottom:14px;color:var(--primary-blue);}
  .login-box input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid #ccc;border-radius:6px;font-size:0.95rem;}
  .login-box button{width:100%;padding:11px;border:none;border-radius:6px;background:var(--primary-blue);color:#fff;font-size:0.95rem;font-weight:bold;cursor:pointer;margin-bottom:8px;}
  .login-box button.secondary{background:var(--accent-orange);}
  .login-msg{font-size:0.82rem;color:var(--danger);min-height:18px;margin-top:4px;}

  /* ---------- panel ---------- */
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px;flex-wrap:wrap;gap:8px;}
  .panel-head h2{font-size:1rem;color:var(--primary-blue);}
  .logout-admin-btn{background:none;border:1px solid var(--danger);color:var(--danger);padding:7px 12px;border-radius:6px;font-size:0.8rem;cursor:pointer;}
  .search-box{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;margin-bottom:14px;font-size:0.9rem;background:#fff;}
  .status-line{font-size:0.82rem;color:#666;margin-bottom:10px;min-height:16px;}

  .user-card{background:var(--card-bg);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .user-info{flex:1;min-width:160px;}
  .user-info .name{font-weight:bold;font-size:0.95rem;}
  .user-info .roll{font-size:0.8rem;color:#666;margin-top:2px;}
  .badge{display:inline-block;font-size:0.7rem;padding:2px 8px;border-radius:20px;margin-top:5px;}
  .badge.online{background:#e8f5e9;color:var(--ok);}
  .badge.offline{background:#f1f1f1;color:#888;}
  .badge.pending{background:#fdecea;color:var(--danger);margin-left:6px;}

  .logout-btn{background:var(--danger);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-size:0.85rem;font-weight:bold;cursor:pointer;white-space:nowrap;}
  .logout-btn:disabled{background:#e0a9a3;cursor:default;}
  .empty-msg{text-align:center;color:#888;padding:30px 10px;font-size:0.9rem;}
</style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1>Force Logout Admin Panel</h1>
      <p>Remotely sign a user out of the application</p>
    </div>
  </div>

  <div class="wrap">

    <!-- LOGIN VIEW -->
    <div id="loginView" class="login-box">
      <h2>Admin Login</h2>
      <input id="adminEmail" type="email" placeholder="Admin email">
      <input id="adminPassword" type="password" placeholder="Password">
      <button onclick="doAdminLogin()">Login</button>
      <button class="secondary" onclick="doCreateAdmin()">Create Admin Account</button>
      <p id="loginMsg" class="login-msg"></p>
    </div>

    <!-- PANEL VIEW -->
    <div id="panelView" style="display:none;">
      <div class="panel-head">
        <h2>All Users</h2>
        <button class="logout-admin-btn" onclick="doAdminLogout()">Logout Admin</button>
      </div>
      <input id="searchBox" class="search-box" placeholder="Search by name or roll number…" oninput="renderUsers()">
      <p id="statusLine" class="status-line">Loading users…</p>
      <div id="usersList"></div>
    </div>

  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// Same Firebase project as the main portal app (testingpro.html), so this
// panel reads/writes the exact same 'portal/users' and 'portal/activeSessions'
// data. This is intentionally a separate, standalone file — same pattern as
// the existing "Red Tick Admin Panel" (red-tick-admin.html).
const firebaseConfig = {
  apiKey: "AIzaSyAegYu-tHbS662BnPV3pyTFBGoKw1jomMQ",
  authDomain: "mmitsce.firebaseapp.com",
  databaseURL: "https://mmitsce-default-rtdb.firebaseio.com",
  projectId: "mmitsce",
  storageBucket: "mmitsce.firebasestorage.app"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const ADMIN_EMAIL = "admin@mmitsce.com";

function esc(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let usersData = {};
let activeSessions = {};

function authErrorMsg(e){
  const m = {
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/user-not-found": "Admin account not found. Please tap Create Admin Account first.",
    "auth/wrong-password": "Incorrect password.",
    "auth/invalid-email": "Email address is not valid.",
    "auth/email-already-in-use": "This admin email is already registered. Please log in.",
    "auth/weak-password": "Password should be at least 6 characters long."
  };
  return m[e.code] || e.message || "Firebase Authentication error.";
}

window.doAdminLogin = async function(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPassword').value;
  const msg = document.getElementById('loginMsg');
  if(email !== ADMIN_EMAIL){ msg.textContent = 'Only the configured admin email is allowed to log in.'; return; }
  if(!pass){ msg.textContent = 'Please enter your password.'; return; }
  msg.textContent = 'Logging in…';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    msg.textContent = 'Login failed: ' + authErrorMsg(e);
  }
};

window.doCreateAdmin = async function(){
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPassword').value;
  const msg = document.getElementById('loginMsg');
  if(email !== ADMIN_EMAIL){ msg.textContent = 'Admin email must match the configured admin email.'; return; }
  if(!pass || pass.length < 6){ msg.textContent = 'Password should be at least 6 characters long.'; return; }
  msg.textContent = 'Creating admin account…';
  try{
    await createUserWithEmailAndPassword(auth, email, pass);
  }catch(e){
    msg.textContent = 'Account creation failed: ' + authErrorMsg(e);
  }
};

window.doAdminLogout = () => signOut(auth);

// Sends the force-logout signal. The main portal app (testingpro.html) is
// already listening to 'portal/users' in real time and will detect this flag
// and sign the user out of their own app automatically — the user cannot
// prevent or dismiss it. This can be sent again even if a signal is already
// pending (e.g. the target was offline last time and never picked it up).
window.forceLogoutUser = async function(roll){
  if(!confirm('Force logout this user from their application right now?')) return;
  const statusLine = document.getElementById('statusLine');
  try{
    await update(ref(db, 'portal/users/' + roll), { forceLogout: true });
    statusLine.textContent = 'Logout signal sent to ' + roll + '. Takes effect the moment their app is open (now, or next time they open it).';
  }catch(e){
    statusLine.textContent = 'Failed to send logout signal: ' + e.message;
  }
};

// Clears a stuck/pending signal without waiting for the user's app to do it
// itself — useful for testing, or if you sent it by mistake.
window.cancelLogoutSignal = async function(roll){
  const statusLine = document.getElementById('statusLine');
  try{
    await update(ref(db, 'portal/users/' + roll), { forceLogout: false });
    statusLine.textContent = 'Pending signal cleared for ' + roll + '.';
  }catch(e){
    statusLine.textContent = 'Failed to clear signal: ' + e.message;
  }
};

function renderUsers(){
  const list = document.getElementById('usersList');
  const q = (document.getElementById('searchBox').value || '').trim().toLowerCase();
  const users = Object.values(usersData || {}).sort((a,b) => String(a.name||'').localeCompare(String(b.name||'')));
  const filtered = q ? users.filter(u =>
      String(u.name||'').toLowerCase().includes(q) || String(u.rollNumber||'').toLowerCase().includes(q)
    ) : users;

  if(!filtered.length){
    list.innerHTML = '<div class="empty-msg">No users found.</div>';
    return;
  }

  list.innerHTML = filtered.map(u => {
    const roll = String(u.rollNumber);
    const online = !!activeSessions[roll];
    const pending = !!u.forceLogout;
    return `
      <div class="user-card">
        <div class="user-info">
          <div class="name">${esc(u.name)}</div>
          <div class="roll">Roll No: ${esc(roll)}</div>
          <span class="badge ${online ? 'online' : 'offline'}">${online ? 'Online' : 'Offline'}</span>
          ${pending ? '<span class="badge pending">Logout pending…</span>' : ''}
        </div>
        <div style="display:flex;gap:8px;">
          ${pending ? `<button class="logout-admin-btn" onclick="cancelLogoutSignal('${roll}')">Cancel</button>` : ''}
          <button class="logout-btn" onclick="forceLogoutUser('${roll}')">
            ${pending ? 'Resend' : 'Logout'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}
window.renderUsers = renderUsers;

onAuthStateChanged(auth, user => {
  document.getElementById('loginView').style.display = user ? 'none' : 'block';
  document.getElementById('panelView').style.display = user ? 'block' : 'none';
  document.getElementById('loginMsg').textContent = '';
});

onValue(ref(db, 'portal/users'), snap => {
  usersData = snap.val() || {};
  document.getElementById('statusLine').textContent = Object.keys(usersData).length + ' user(s) loaded.';
  renderUsers();
}, err => {
  document.getElementById('statusLine').textContent = 'Error loading users: ' + err.message;
});

onValue(ref(db, 'portal/activeSessions'), snap => {
  activeSessions = snap.val() || {};
  renderUsers();
});
</script>
</body>
</html>
